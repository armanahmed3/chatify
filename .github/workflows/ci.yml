name: CI/CD Pipeline & Security Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Typecheck, Test, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --no-fund

      - name: Secret Scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Security Vulnerability Audit (runtime deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit & Security Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Verify no browser source maps shipped
        run: |
          if find .next/static -name '*.map' | grep -q .; then
            echo "Source maps found in .next/static"; exit 1
          fi

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: quality-and-security
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chatify-platform:ci .
